name: Build and deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build provider
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          cache-dependency-glob: scripts/format-python.ts

      - name: Install Node dependencies without running install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Go dependencies
        run: go mod download

      - name: Run lint checks
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Install Node dependencies without running install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Go dependencies
        run: go mod download

      - name: Run tooling tests
        run: node --test scripts/*.test.ts

      - name: Run race tests and produce coverage reports
        run: pnpm run coverage

      - name: Upload unit coverage to Codecov
        if: github.event_name != 'workflow_dispatch'
        uses: codecov/codecov-action@v7
        with:
          files: coverage-report/unit.out
          flags: unit
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage-report/
          if-no-files-found: error

      - name: Upload badge data for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage-report/badges

  coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: coverage-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that the commit is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/check-current-commit.sh

      - name: Deploy coverage badges
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
