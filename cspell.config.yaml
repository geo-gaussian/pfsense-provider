version: "0.2"
language: en-GB

ignorePaths:
  - .git
  - node_modules
  - "**/go.sum"
  - "**/go.mod"
  - "**/pnpm-lock.yaml"
  - "**/*.png"
  - pnpm-lock.yaml
  - docs/nexus.openapi.yaml
  - "**/*_gen.go"

files:
  - "**/*.go"
  - "**/*.json"
  - "**/*.md"
  - "**/*.sh"
  - "**/*.tf"
  - "**/*.txt"
  - "**/*.yaml"
  - "**/*.yml"

dictionaryDefinitions:
  - name: project-terms
    path: .cspell/project-terms.txt
    addWords: true

dictionaries:
  - project-terms
  - go
  - softwareTerms
  - filetypes
  - en_GB

words:
  - Terraform
  - parametric
  - recompute
  - STEP
  - JSON
  - YAML
  - YAPF
  - precommit
  - repo
  - repos
  - linting
  - lint
  - CLI

ignoreWords:
  - todo
  - FIXME

overrides:
  - filename: "**/.gitignore"
    includeRegExpList:
      - "/#.*/"
  - filename:
      - ".github/skills/speckit-*/**"
      - ".specify/scripts/**"
      - ".specify/templates/*"
      - ".specify/workflows/speckit/**"
    language: "en-GB,en-US"
    words:
      # cspell:disable
      - TKTK
      - Measurability
      - tradeoffs
      - pycache
      - venv
      - rlib
      - autom
      - swiftpm
      - Rproj
      - Ruserdata
      - renv
      - tfstate
      - tfvars
      - kubeconfig
      - parallelizable
      - unparseable
      - isinstance
      - RSTART
      - RLENGTH
      - lexists
      - TMPL
      - runpy
      - strat
      - uncollapsed
      - isalpha
      - isdecimal
      - shlex
      - pytest
      - TXXX
      - alquimia
      # cspell:enable

allowCompoundWords: true
useGitignore: true
enableGlobDot: true
